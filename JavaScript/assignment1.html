<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .cart-container {
            max-width: 400px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .item-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #d70e0e;
        }
        .total-row {
            margin-top: 15px;
            font-weight: bold;
            font-size: 1.2em;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="cart-container">
        <div id="display"></div>
        <div class="total-row" id="result"></div>
    </div>
    <script>
        const items={
            tea:450,
            coffee:600,
            sugar:700,
            pulse:100 
        }
    let menuHtml = "";
    for (const key in items) {
     menuHtml += key + " is " + items[key]+"<br/>";
    } 
    document.getElementById("display").innerHTML = menuHtml;
     let amount = 0;
     while(prompt("enter 1 to get product 0 to exit")==1){
     let product=prompt("enter your product from list");
     let quantity=prompt("eneter the quantity");
     amount=amount+items[product]*quantity;
     }
     document.getElementById("result").innerText = amount;
    </script>
</body>
</html>
