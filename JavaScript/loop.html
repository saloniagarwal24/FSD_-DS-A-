    <p id="demo"></p>
    <script>
        const car=["car1","car2","car3"];
        let text=" ";
        let len=car.length;
        for(let i=0;i<len;i++)
        text+=car[i]+"<br>"
        for(let i=1;i<=10;i++)
    {
        document.write("<br> abes college");

    document.getElementById("demo").innerHTML=text;
    let number=prompt("enter table number");
    let i=0;
    while(i<=10)
    {
        document.write("number*i");
    }
    const cars = [
    { name: "Swift", cost: 700000, seats: 5 },
    { name: "Fortuner", cost: 3500000, seats: 7 },
    { name: "Thar", cost: 1800000, seats: 4 },
    { name: "Ertiga", cost: 1200000, seats: 7 }
];

const aeroplane = [
    { name: "Boeing 737", cost: 80000000, seats: 180 },
    { name: "Airbus A320", cost: 90000000, seats: 186 },
    { name: "Boeing 777", cost: 200000000, seats: 396 },
    { name: "Airbus A380", cost: 400000000, seats: 500 }
];

const helicopter = [
    { name: "Robinson R44", cost: 50000000, seats: 4 },
    { name: "Bell 206", cost: 70000000, seats: 5 },
    { name: "Airbus H125", cost: 90000000, seats: 6 },
    { name: "Sikorsky S-76", cost: 150000000, seats: 12 }
];
const getCarCost = (seats) => {
    const vehicle = cars.find(car => car.seats === seats);
    return vehicle ? vehicle.cost : "No car found";
};

const getAeroplaneCost = (seats) => {
    const vehicle = aeroplane.find(plane => plane.seats === seats);
    return vehicle ? vehicle.cost : "No aeroplane found";
};

const getHelicopterCost = (seats) => {
    const vehicle = helicopter.find(heli => heli.seats === seats);
    return vehicle ? vehicle.cost : "No helicopter found";
};

    </script>
