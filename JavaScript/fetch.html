    <script>
     const ele= documnet.getElementById("data");
     const url="https://dummyjson.com/products";
     async function loaddata(){
        try{
        const res=await fetch(url);//converted fetched json data into a string 
        const data=await res.json();//convert the data back into og form
        console.log("data",data.products);
        let row="";
        //map fucntion array ke elemnt ko modify krta tha 
        data.products.map((i,INDEX)=>{
         row+=`
         <tr> 
            <td ${INDEX+1}></td>
            <td ${i.title}></td>
             <td><img src="${i.images[0]}"/></td>
             <td ${i.category}></td>
              <td ${i.price}></td>
            </tr>`;
            ele.innerHTML=row;
        })
        }
        catch(err){
      console.log("error",err);
        }
    //string literals means if u want add num in string let a=10
     }
     laoddata();
