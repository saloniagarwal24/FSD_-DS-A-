<body>
    <script>
          const num=[1,2,3,4,5,6,7,9];
        const even=num.filter((i)=>(i%2==0));
        const square=even.map((i)=>(i*i));
        const sum=square.reduce((i,s)=>(i+s))
        console.log("sum==",sum);
        //we use map while fetching api
    </script>
    
</body>
